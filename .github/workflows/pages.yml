name: FactuurCheck publiceren
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p site
          cp index.html app.mjs core.mjs archive.mjs scanner.mjs ledger.mjs cloud.mjs manifest.webmanifest icon.svg site/
          touch site/.nojekyll
          grep -q 'FactuurCheck · v0.5.1' site/index.html
          grep -q 'app.mjs?v=0.5.1' site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
